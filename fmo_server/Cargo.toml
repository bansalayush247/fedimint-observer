[package]
name = "fmo_server"
version = "0.2.0"
edition = "2021"
description = "The default Fedimint Observer build"

[dependencies]
anyhow = "1.0.81"
fmo_core = { path = "../fmo_core" }
fmo_module_ln = { path = "../fmo_modules/fmo_module_ln" }
fmo_module_mint = { path = "../fmo_modules/fmo_module_mint" }
fmo_module_wallet = { path = "../fmo_modules/fmo_module_wallet" }
tokio = { version = "1.37.0", features = ["full"] }

[features]
stability_pool_v1 = ["fmo_core/stability_pool_v1"]
